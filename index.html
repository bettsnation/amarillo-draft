<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏈</text></svg>">
<title>Draft Lottery 2026 — Amarillo · FantasyBetts</title>
<style>
  :root {
    --bg: #0b1120; --bg2: #0f172a; --panel: #16213a; --line: #263353;
    --text: #f8fafc; --dim: #8fa3c2; --faint: #5b6b8c;
    --green: #22c55e; --green-deep: #14532d; --gold: #eab308; --gold-dim: #a16207;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background:
      radial-gradient(1200px 500px at 50% -100px, #1a2b4d 0%, transparent 70%),
      repeating-linear-gradient(90deg, transparent 0 119px, rgba(255,255,255,.015) 119px 120px),
      var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 0 16px 24px; min-height: 100vh;
  }
  .wrap { max-width: 1150px; margin: 0 auto; }

  /* ── marquee header ─────────────────────────────── */
  .marquee { text-align: center; padding: 30px 0 22px; }
  .marquee .brand {
    font-size: .95rem; font-weight: 800; letter-spacing: .45em; text-indent: .45em;
    color: var(--gold); text-transform: uppercase;
  }
  .marquee h1 {
    font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 900; letter-spacing: .02em;
    text-transform: uppercase; line-height: 1.05; margin: 6px 0 4px;
  }
  .marquee h1 em { font-style: normal; color: var(--green); }
  .marquee .where { color: var(--dim); font-weight: 600; letter-spacing: .25em; text-indent: .25em; text-transform: uppercase; font-size: .85rem; }
  .rule { height: 3px; max-width: 420px; margin: 16px auto 0;
          background: linear-gradient(90deg, transparent, var(--gold), transparent); border-radius: 2px; }

  /* ── pot banner ─────────────────────────────────── */
  .pot {
    display: flex; justify-content: center; gap: 10px; align-items: center; flex-wrap: wrap;
    margin: 14px auto 26px; color: var(--dim); font-weight: 600;
  }
  .pot .chip {
    background: linear-gradient(180deg, #1d2b17, #16240f); border: 1px solid var(--green-deep);
    color: var(--green); border-radius: 99px; padding: 5px 16px; font-weight: 800; letter-spacing: .04em;
  }

  /* ── on the clock ───────────────────────────────── */
  .clock {
    position: relative; overflow: hidden; text-align: center;
    border: 1px solid var(--gold-dim); border-radius: 16px;
    background: linear-gradient(120deg, #201a05 0%, #16213a 55%, #16213a 100%);
    padding: 22px 18px 24px; margin-bottom: 10px;
  }
  .clock::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(500px 120px at 50% 0%, rgba(234,179,8,.14), transparent 70%);
  }
  .clock .tag {
    display: inline-block; background: var(--gold); color: #1c1500; font-weight: 900;
    font-size: .78rem; letter-spacing: .3em; text-indent: .3em; text-transform: uppercase;
    border-radius: 4px; padding: 3px 12px; animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .55; } }
  .clock .who { font-size: clamp(2.2rem, 7vw, 3.6rem); font-weight: 900; text-transform: uppercase; letter-spacing: .03em; margin-top: 8px; }
  .clock .team { color: var(--dim); font-size: 1rem; }
  .clock .sub { color: var(--faint); font-size: .85rem; margin-top: 8px; }
  .clock.done { border-color: var(--green-deep); background: linear-gradient(120deg, #0f2417, #16213a 60%); }
  .clock.done .tag { background: var(--green); animation: none; }

  .next-up { text-align: center; color: var(--faint); font-size: .85rem; margin: 10px 0 26px; letter-spacing: .02em; }
  .next-up b { color: var(--dim); font-weight: 700; }

  /* ── layout ─────────────────────────────────────── */
  .grid { display: grid; gap: 18px; grid-template-columns: 1fr; }
  @media (min-width: 940px) { .grid { grid-template-columns: 3fr 2fr; align-items: start; } }
  section h2 {
    font-size: .8rem; letter-spacing: .3em; text-indent: .3em; text-transform: uppercase;
    color: var(--faint); text-align: center; margin-bottom: 14px; font-weight: 800;
  }

  /* ── draft board cards ──────────────────────────── */
  .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 10px; }
  .card {
    position: relative; border-radius: 12px; padding: 12px 12px 10px; min-height: 92px;
    background: linear-gradient(180deg, #182543, #131d36);
    border: 1px solid var(--line);
  }
  .card .pick {
    position: absolute; top: 8px; right: 10px; font-size: 1.9rem; font-weight: 900;
    color: rgba(255,255,255,.08); line-height: 1;
  }
  .card .lbl { font-size: .68rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); }
  .card .name { font-size: 1.15rem; font-weight: 900; text-transform: uppercase; margin-top: 14px; }
  .card .team { color: var(--dim); font-size: .74rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card.taken { border-color: #2c7a44; background: linear-gradient(180deg, #14311f, #0f2417); }
  .card.taken .pick { color: rgba(34,197,94,.22); }
  .card.taken .lbl { color: var(--green); }
  .card.open .name { color: var(--faint); font-weight: 700; font-size: .95rem; margin-top: 20px; letter-spacing: .1em; }

  /* ── order list ─────────────────────────────────── */
  .order { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid rgba(38,51,83,.55); }
  .row:last-child { border-bottom: 0; }
  .row .idx {
    width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center;
    background: #1d2a4a; color: var(--dim); font-weight: 800; font-size: .85rem;
  }
  .row .nm { font-weight: 800; }
  .row .tm { color: var(--faint); font-size: .74rem; }
  .row .right { margin-left: auto; text-align: right; font-size: .78rem; font-weight: 800; letter-spacing: .06em; }
  .row.current { background: linear-gradient(90deg, rgba(234,179,8,.10), transparent 70%); }
  .row.current .idx { background: var(--gold); color: #1c1500; }
  .row.current .right { color: var(--gold); }
  .row.picked { opacity: .55; }
  .row.picked .idx { background: var(--green-deep); color: var(--green); }
  .row.picked .right { color: var(--green); }
  .row .paid { color: var(--green); font-size: .68rem; font-weight: 700; letter-spacing: .08em; }

  /* ── rivalries ──────────────────────────────────── */
  .rivalries { margin-top: 26px; }
  .riv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .riv {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
    background: linear-gradient(180deg, #182543, #131d36); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 12px;
  }
  .riv .side { text-align: center; min-width: 0; }
  .riv .side .nm { font-weight: 900; text-transform: uppercase; font-size: 1rem; }
  .riv .side .tm { color: var(--faint); font-size: .7rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .riv .vs {
    font-weight: 900; font-size: .8rem; color: var(--gold); letter-spacing: .1em;
    border: 1px solid var(--gold-dim); border-radius: 99px; padding: 2px 10px;
  }
  .riv.tbd { border-style: dashed; }
  .riv.tbd .nm { color: var(--faint); font-weight: 700; letter-spacing: .1em; }
  .riv.tbd .vs { color: var(--faint); border-color: var(--line); }
  .riv-note { text-align: center; color: var(--faint); font-size: .82rem; margin-top: 12px; }

  footer {
    max-width: 1150px; margin: 34px auto 0; padding-top: 14px; border-top: 1px solid var(--line);
    color: var(--faint); font-size: .78rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  footer a { color: var(--faint); }
</style>
</head>
<body>
<div class="wrap">

  <header class="marquee">
    <div class="brand">FantasyBetts</div>
    <h1>Draft Lottery <em>2026</em></h1>
    <div class="where">Amarillo, Texas · 14 Teams</div>
    <div class="rule"></div>
  </header>

  <div class="pot" id="pot"></div>

  <div class="clock" id="clock"></div>
  <div class="next-up" id="next-up"></div>

  <div class="grid">
    <section>
      <h2>The Board</h2>
      <div class="board" id="board"></div>
    </section>
    <section>
      <h2>Selection Order</h2>
      <div class="order" id="order"></div>
    </section>
  </div>

  <section class="rivalries">
    <h2>Rivalry Pairings · Week 1 &amp; Week 14</h2>
    <div class="riv-grid" id="rivalries"></div>
    <div class="riv-note" id="riv-note"></div>
  </section>

</div>

<footer>
  <span>Positions are announced in the group chat and posted here by the commish. <b style="color:var(--green)">● LIVE</b> — this page updates itself.</span>
  <span>Fantasy data provided by <a href="https://football.fantasysports.yahoo.com/" target="_blank" rel="noopener noreferrer">Yahoo Fantasy</a></span>
</footer>

<script>
"use strict";
// Old interactive version stored state here; clear the leftovers.
try { localStorage.removeItem("amarillo-draft-2026"); } catch (e) {}
/* READ-ONLY BOARD. Picks are announced to Rod in the group chat; a session
   edits SEED.slots below, bumps rev, and pushes - Pages redeploys and everyone
   sees the new board on refresh. No local state, no interaction.
   Selection order is the official one Rod set 2026-08-20.
   ("Berg" = Jason Barenberg, "Dad Berg" = Jeff Barenberg.) */
const FEE = 150;
const SEED = {
  rev: 11,
  slots: {
    "3": "tagan",   // 1st selection, 2026-08-20
    "5": "jason",   // Berg, 2nd selection, 2026-08-20
    "6": "rodney",  // Rod, 3rd selection, 2026-08-20
  },
  // Rivals meet home-and-home: week 1 and week 14, the regular-season
  // bookends. Pairs are announced by Rod and published here like picks.
  rivalries: [
    ["antiwon", "jeff"],   // Twon chose Dad Berg, 2026-08-20
    ["chad", "kevin"],     // Chad chose Kevin, 2026-08-20
    ["josiah", "jason"],   // Josiah chose Berg, 2026-08-20
  ],
  owners: [ // in selection order
    { id: "tagan",  name: "Tagan",    team: "Esch Mode" },
    { id: "jason",  name: "Berg",     team: "IMAGONNAKILLU" },
    { id: "rodney", name: "Rod",      team: "Dem Ballplayers" },
    { id: "j",      name: "J",        team: "CeeDee Nutz! (j)" },
    { id: "larry",  name: "Larry",    team: "Kicked out" },
    { id: "david",  name: "David",    team: "Team Hase" },
    { id: "terrance", name: "Terrance", team: "Ravens" },  // replaced Cash, 2026-08-20
    { id: "chuck",  name: "Chuck",    team: "West Canaan Coyotes" },
    { id: "kevin",  name: "Kevin",    team: "No Limit Soldiers" },
    { id: "jeff",   name: "Dad Berg", team: "TxVikings's Team" },
    { id: "antiwon",name: "Twon",     team: "The Underdogs" },
    { id: "josiah", name: "Josiah",   team: "Stryker Brigade R3birth" },
    { id: "ryan",   name: "Ryan",     team: "Jerry's Libtard Money Makers" },
    { id: "chad",   name: "Chad",     team: "Kiss My Blackshears" },
  ],
};

const N = SEED.owners.length;
const byId = Object.fromEntries(SEED.owners.map(o => [o.id, o]));
const slotOf = id => Object.keys(SEED.slots).find(s => SEED.slots[s] === id);
const esc = t => { const d = document.createElement("span"); d.textContent = t; return d.innerHTML; };

// pot - everyone is paid up
document.getElementById("pot").innerHTML =
  '<span class="chip">💰 All 14 paid</span><span>$' + (N * FEE).toLocaleString() + " pot · $" + FEE + " a head</span>";

// on the clock = first in order without a position
const remaining = SEED.owners.filter(o => !slotOf(o.id));
const clock = document.getElementById("clock");
if (remaining.length) {
  const cur = remaining[0];
  clock.innerHTML =
    '<div style="position:relative"><span class="tag">On the Clock</span>' +
    '<div class="who">' + esc(cur.name) + "</div>" +
    '<div class="team">' + esc(cur.team) + "</div>" +
    '<div class="sub">choosing their draft position · announce it in the group chat</div></div>';
} else {
  clock.className = "clock done";
  clock.innerHTML =
    '<div style="position:relative"><span class="tag">Order Locked</span>' +
    '<div class="who">See you in Amarillo 🏈</div>' +
    '<div class="sub">the 2026 draft order is set</div></div>';
}
document.getElementById("next-up").innerHTML = remaining.length > 1
  ? "Next up: <b>" + remaining.slice(1, 4).map(o => esc(o.name)).join("</b> · <b>") + "</b>"
  : "";

// board
const board = document.getElementById("board");
for (let s = 1; s <= N; s++) {
  const id = SEED.slots[s];
  const div = document.createElement("div");
  div.className = "card " + (id ? "taken" : "open");
  div.innerHTML = '<div class="pick">' + s + "</div>" +
    '<div class="lbl">Pick ' + s + "</div>" +
    (id
      ? '<div class="name">' + esc(byId[id].name) + '</div><div class="team">' + esc(byId[id].team) + "</div>"
      : '<div class="name">Open</div>');
  board.appendChild(div);
}

// selection order
const order = document.getElementById("order");
let currentSeen = false;
SEED.owners.forEach((o, i) => {
  const picked = slotOf(o.id);
  const isCurrent = !picked && !currentSeen;
  if (isCurrent) currentSeen = true;
  const row = document.createElement("div");
  row.className = "row" + (picked ? " picked" : isCurrent ? " current" : "");
  row.innerHTML =
    '<div class="idx">' + (i + 1) + "</div>" +
    '<div><div class="nm">' + esc(o.name) + '</div><div class="tm">' + esc(o.team) + "</div></div>" +
    '<div class="right">' + (picked ? "PICK " + picked : isCurrent ? "ON THE CLOCK" : '<span class="paid">PAID ✓</span>') + "</div>";
  order.appendChild(row);
});

/* ── stay fresh ──────────────────────────────────────────────────────────
   GitHub Pages caches this file for 10 minutes and won't let us change
   that header. So the page checks its own source for a newer rev - with a
   cache-bypassing fetch - on load, every 60s, and whenever the tab comes
   back into view. A newer rev swaps the page via a cache-busting query, so
   picks show up within seconds of being published, no hard refresh needed. */
let swapping = false;
async function checkForUpdate() {
  if (swapping || !navigator.onLine) return;
  try {
    const res = await fetch(location.pathname, { cache: "no-store" });
    if (!res.ok) return;
    const m = (await res.text()).match(/rev:\s*(\d+)/);
    if (m && Number(m[1]) > SEED.rev) {
      swapping = true;
      location.replace(location.pathname + "?v=" + m[1]);
    }
  } catch (e) { /* offline blip - try again next tick */ }
}
checkForUpdate();
setInterval(checkForUpdate, 60000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") checkForUpdate();
});

// rivalries
{
  const grid = document.getElementById("rivalries");
  const paired = new Set(SEED.rivalries.flat());
  SEED.rivalries.forEach(([a, b]) => {
    const div = document.createElement("div");
    div.className = "riv";
    div.innerHTML =
      '<div class="side"><div class="nm">' + esc(byId[a].name) + '</div><div class="tm">' + esc(byId[a].team) + "</div></div>" +
      '<div class="vs">VS</div>' +
      '<div class="side"><div class="nm">' + esc(byId[b].name) + '</div><div class="tm">' + esc(byId[b].team) + "</div></div>";
    grid.appendChild(div);
  });
  for (let i = SEED.rivalries.length; i < N / 2; i++) {
    const div = document.createElement("div");
    div.className = "riv tbd";
    div.innerHTML = '<div class="side"><div class="nm">TBA</div></div><div class="vs">VS</div><div class="side"><div class="nm">TBA</div></div>';
    grid.appendChild(div);
  }
  const unpaired = SEED.owners.filter(o => !paired.has(o.id));
  document.getElementById("riv-note").textContent =
    paired.size === 0
      ? "Rivalries will be announced - each pair plays each other in week 1 and week 14."
      : unpaired.length
        ? "Still to be paired: " + unpaired.map(o => o.name).join(", ")
        : "All rivalries are set - see you in week 1.";
}
</script>
</body>
</html>
