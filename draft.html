<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏈</text></svg>">
<title>Live Draft — Amarillo 2026 · FantasyBetts</title>
<style>
  :root {
    --bg: #0b1120; --panel: #16213a; --line: #263353;
    --text: #f8fafc; --dim: #8fa3c2; --faint: #5b6b8c;
    --green: #22c55e; --green-deep: #14532d; --gold: #eab308; --gold-dim: #a16207;
    --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: radial-gradient(1200px 500px at 50% -100px, #1a2b4d 0%, transparent 70%), var(--bg);
    color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 0 14px 24px; min-height: 100vh;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  .marquee { text-align: center; padding: 26px 0 16px; }
  .marquee .brand { font-size: .85rem; font-weight: 800; letter-spacing: .45em; text-indent: .45em; color: var(--gold); text-transform: uppercase; }
  .marquee h1 { font-size: clamp(1.7rem, 6vw, 2.8rem); font-weight: 900; text-transform: uppercase; line-height: 1.05; margin: 4px 0; }
  .marquee h1 em { font-style: normal; color: var(--green); }
  .status { text-align: center; color: var(--faint); font-size: .8rem; margin-bottom: 18px; }
  .status .live { color: var(--green); font-weight: 800; }
  .status .stale { color: var(--red); font-weight: 800; }

  .clock {
    text-align: center; border: 1px solid var(--gold-dim); border-radius: 16px;
    background: linear-gradient(120deg, #201a05 0%, #16213a 60%);
    padding: 18px 14px; margin-bottom: 14px;
  }
  .clock .tag { display: inline-block; background: var(--gold); color: #1c1500; font-weight: 900;
    font-size: .72rem; letter-spacing: .28em; text-indent: .28em; text-transform: uppercase;
    border-radius: 4px; padding: 3px 12px; animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .clock .who { font-size: clamp(1.8rem, 6vw, 2.8rem); font-weight: 900; text-transform: uppercase; margin-top: 6px; }
  .clock .sub { color: var(--dim); font-size: .85rem; }
  .clock.done { border-color: var(--green-deep); background: linear-gradient(120deg, #0f2417, #16213a 60%); }
  .clock.done .tag { background: var(--green); animation: none; }

  .last { text-align: center; margin-bottom: 22px; color: var(--dim); font-size: .95rem; }
  .last b { color: var(--text); }

  h2 { font-size: .75rem; letter-spacing: .3em; text-indent: .3em; text-transform: uppercase;
       color: var(--faint); margin: 20px 0 8px; font-weight: 800; text-align: center; }
  .round { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .round .hd { padding: 7px 14px; font-weight: 800; font-size: .78rem; letter-spacing: .15em;
               text-transform: uppercase; color: var(--dim); background: rgba(38,51,83,.4); }
  .p { display: flex; gap: 10px; align-items: baseline; padding: 6px 14px; border-top: 1px solid rgba(38,51,83,.5); font-size: .92rem; }
  .p .n { color: var(--faint); font-size: .75rem; width: 34px; flex: none; }
  .p .owner { font-weight: 800; width: 88px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p .player { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p .meta { margin-left: auto; color: var(--faint); font-size: .75rem; flex: none; }
  .p.mine .owner { color: var(--green); }
  .p.onclock { background: rgba(234,179,8,.08); }
  .p.onclock .player { color: var(--gold); font-weight: 700; }
  .empty { text-align: center; color: var(--faint); padding: 40px 10px; }
  footer { max-width: 900px; margin: 30px auto 0; padding-top: 12px; border-top: 1px solid var(--line);
           color: var(--faint); font-size: .76rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  footer a { color: var(--faint); }
</style>
</head>
<body>
<div class="wrap">
  <header class="marquee">
    <div class="brand">FantasyBetts</div>
    <h1>Live Draft <em>2026</em></h1>
  </header>
  <div class="status" id="status">connecting…</div>
  <div class="clock" id="clock"></div>
  <div class="last" id="last"></div>
  <div id="rounds"></div>
</div>
<footer>
  <span><a href="/">Draft lottery &amp; rivalries</a></span>
  <span>Fantasy data provided by <a href="https://football.fantasysports.yahoo.com/" target="_blank" rel="noopener noreferrer">Yahoo Fantasy</a></span>
</footer>

<script>
"use strict";
/* Read-only mirror of the draft assistant. It polls the fantasybetts API
   (which the assistant pushes to after every pick) every 3s. Slot -> owner
   comes from the 2026 draft lottery, decided on this very site. */
const API = "https://api.fantasybetts.com/api/draftboard/";
const TEAMS = 14, ROUNDS = 15;
const SLOT_OWNER = ["", "Chuck", "Larry", "Tagan", "J", "Berg", "Rod",
                    "Terrance", "David", "Kevin", "Twon", "Josiah", "Ryan", "Chad", "Dad Berg"];
const MY = "Rod";

const esc = t => { const d = document.createElement("span"); d.textContent = t; return d.innerHTML; };
const slotFor = overall => {
  const rnd = Math.floor((overall - 1) / TEAMS), idx = (overall - 1) % TEAMS;
  return rnd % 2 === 0 ? idx + 1 : TEAMS - idx;
};

let lastUpdated = null;

function render(picks) {
  const overall = picks.length + 1;
  const clock = document.getElementById("clock");
  if (picks.length >= TEAMS * ROUNDS) {
    clock.className = "clock done";
    clock.innerHTML = '<span class="tag">Draft Complete</span><div class="who">That&rsquo;s a wrap 🏈</div>';
  } else {
    const owner = SLOT_OWNER[slotFor(overall)];
    const rnd = Math.floor((overall - 1) / TEAMS) + 1;
    clock.className = "clock";
    clock.innerHTML = '<span class="tag">On the Clock</span>' +
      '<div class="who">' + esc(owner) + "</div>" +
      '<div class="sub">round ' + rnd + " · overall pick " + overall + "</div>";
  }

  const last = document.getElementById("last");
  if (picks.length) {
    const p = picks[picks.length - 1];
    last.innerHTML = "Last pick: <b>" + esc(SLOT_OWNER[slotFor(picks.length)]) + "</b> took <b>" +
      esc(p.name) + "</b>" + (p.pos ? " (" + esc(p.pos) + (p.team ? " · " + esc(p.team) : "") + ")" : "");
  } else {
    last.textContent = "";
  }

  const rounds = document.getElementById("rounds");
  if (!picks.length) {
    rounds.innerHTML = '<div class="empty">No picks yet — the board lights up when the draft starts.</div>';
    return;
  }
  let html = "";
  const shownRounds = Math.min(ROUNDS, Math.floor((picks.length - 1) / TEAMS) + 1);
  for (let r = shownRounds; r >= 1; r--) {   // newest round first
    html += '<div class="round"><div class="hd">Round ' + r + "</div>";
    for (let i = 0; i < TEAMS; i++) {
      const overallN = (r - 1) * TEAMS + i + 1;
      const pick = picks[overallN - 1];
      const owner = SLOT_OWNER[slotFor(overallN)];
      if (!pick && overallN !== picks.length + 1) continue;
      const cls = "p" + (owner === MY ? " mine" : "") + (pick ? "" : " onclock");
      html += '<div class="' + cls + '"><span class="n">' + overallN + '</span>' +
        '<span class="owner">' + esc(owner) + "</span>" +
        '<span class="player">' + (pick ? esc(pick.name) : "on the clock…") + "</span>" +
        (pick && pick.pos ? '<span class="meta">' + esc(pick.pos) + (pick.team ? " · " + esc(pick.team) : "") + "</span>" : "") +
        "</div>";
    }
    html += "</div>";
  }
  document.getElementById("rounds").innerHTML = html;
}

async function poll() {
  try {
    const res = await fetch(API, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    lastUpdated = data.updated_at ? new Date(data.updated_at) : null;
    render(data.picks || []);
    tickStatus(true);
  } catch (e) {
    tickStatus(false, e.message);
  }
}

function tickStatus(ok, err) {
  const el = document.getElementById("status");
  if (!ok) { el.innerHTML = '<span class="stale">● OFFLINE</span> — retrying (' + esc(err || "") + ")"; return; }
  const age = lastUpdated ? Math.round((Date.now() - lastUpdated.getTime()) / 1000) : null;
  el.innerHTML = '<span class="live">● LIVE</span>' +
    (age !== null ? " — last update " + (age < 5 ? "just now" : age < 120 ? age + "s ago" : Math.round(age / 60) + "m ago") : " — waiting for the first pick");
}

poll();
setInterval(poll, 3000);
setInterval(() => lastUpdated && tickStatus(true), 5000);
</script>
</body>
</html>
